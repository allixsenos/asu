name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/check-commit.mjs
        env:
          ASU_PR_TITLE: ${{ github.event.pull_request.title }}
      - run: npm pack
      - run: npx --yes --package ./allixsenos-asu-0.1.0.tgz asu --help
