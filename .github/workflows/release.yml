name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT lets the release PR trigger CI. The default token cannot.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@allixsenos'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: echo "TARBALL=$(npm pack --silent)" >> "$GITHUB_ENV"
      - run: npx --yes --package "./$TARBALL" asu --help
      - name: Attach the tarball to the GitHub release
        # asu.tgz gives releases/latest/download a stable filename.
        run: |
          cp "$TARBALL" asu.tgz
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "$TARBALL" asu.tgz
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
